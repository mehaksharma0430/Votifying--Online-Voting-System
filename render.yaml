services:
  - type: web
    name: votifying
    runtime: node
    plan: free
    buildCommand: npm install --prefix server --omit=dev && npm install --prefix client --include=dev && npm run build --prefix client
    startCommand: node server/index.js
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_VERSION
        value: ">=24.0.0 <25.0.0"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE
        sync: false
      - key: SECRET
        generateValue: true
      - key: OTP_MODE
        value: disabled
